<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ResearchPilot Studio</title><link rel="stylesheet" href="studio.css?v=motion1">
<link rel="stylesheet" href="interactions.css?v=motion1">
<link rel="stylesheet" href="cockpit.css?v=cockpit1">
<link rel="stylesheet" href="peer_workspace.css?v=peer1">
<link rel="stylesheet" href="research_tools.css?v=research1"></head>
<body>
<div id="studio" class="studio">
  <nav class="rail" aria-label="工作区导航">
    <button class="mark" data-action="home" aria-label="ResearchPilot 首页">r<span>p</span><i></i></button>
    <div class="rail-links">
      <button class="rail-item selected" data-view="research" aria-label="研究空间" title="研究空间"><span data-icon="book"></span></button>
      <button class="rail-item" data-view="watchlist" aria-label="自选公司" title="自选公司"><span data-icon="grid"></span></button>
      <button class="rail-item" data-view="screening" aria-label="财务筛选" title="财务筛选"><span data-icon="sliders"></span></button>
    </div>
    <button class="rail-item bottom" data-view="workbench" aria-label="数据工具" title="数据工具"><span data-icon="settings"></span></button>
    <div class="avatar" title="本地工作台">L</div>
  </nav>
  <aside class="library" id="library">
    <div class="library-brand"><b>ResearchPilot</b><span>研究工作台</span></div>
    <button class="new-button" data-action="new"><span data-icon="plus"></span>新建研究 <kbd>N</kbd></button>
    <button class="search-button" data-action="palette"><span data-icon="search"></span>搜索研究 <kbd>Ctrl K</kbd></button>
    <div class="library-label">研究记录 <span id="history-count">0</span></div>
    <div id="history" class="history"></div>
    <div class="library-foot"><span class="local-dot"></span>本地存储<div>保存研究报告与参考资料。</div></div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <button class="icon-button mobile-menu" data-action="menu" aria-label="打开任务列表"><span data-icon="menu"></span></button>
      <div class="breadcrumb">工作台 <span>/</span> <b id="workspace-name">研究空间</b></div>
      <div class="topbar-meta"><span id="preview-badge" class="tag amber" hidden>离线演示 · 虚构数据</span><span class="local-status"><i></i>本地连接</span></div>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<div id="notice" role="status" hidden></div>
<dialog id="palette" aria-labelledby="palette-title"><div class="palette-header"><span data-icon="search"></span><input id="palette-query" aria-label="搜索研究任务" placeholder="搜索主题、公司、代码…"><button class="icon-button" data-action="close-palette" aria-label="关闭搜索">Esc</button></div><h2 id="palette-title" class="sr-only">查找研究记录</h2><div id="palette-results"></div><div class="palette-foot">↑ ↓ 选择 · Enter 打开 · Esc 关闭</div></dialog>
<script src="interactions.js?v=peer20261018"></script>
<script src="research_tools.js?v=peer20261018"></script>
<script src="cockpit.js?v=peer20261018"></script>
<script src="peer_workspace.js?v=peer1"></script>
<script src="studio.js?v=peer20261018"></script>
</body></html>
